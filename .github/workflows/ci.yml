name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint (web)
        run: npx --no-install eslint apps/web --config apps/web/eslint.config.mjs --max-warnings=0

      - name: Unit tests
        run: npm run test

      - name: Build API
        run: npm run build:api

      - name: Build frontend
        run: npm run build:web
